name: mobile-release

# Builds the iOS and Android apps on GitHub-hosted runners from the native
# projects `expo prebuild` generates, signs them with keys held in GitHub
# secrets, and uploads with fastlane: iOS to TestFlight, Android to a Play
# testing track (internal by default). Promotion to the public stores is a
# deliberate manual step in App Store Connect / Play Console.
#
# No Expo build or submit service is involved.
#
# Started by release-please.yml after a release is cut (tag pushes made with
# GITHUB_TOKEN do not start workflows, but workflow_dispatch does), or by hand.
# Until the signing secrets exist the jobs still prove the build: iOS archives
# unsigned and Android signs with a throwaway key, and nothing is uploaded.
#
# Signing and store secrets live in the `release` environment, which only
# main and v* tags can use; nothing else in the repository can read them.
# Secrets and variables: docs/ci-secrets.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v5.3.0)"
        required: true
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options: [all, ios, android]
      upload:
        description: "Upload to TestFlight / Play after building"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      play_track:
        description: "Play track for the Android upload"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta]
      build_revision:
        description: "Rebuild counter 0-999 (bump to re-upload the same version)"
        required: true
        default: "0"

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RFSPAGER_RELEASE: "1"
  MOBILE_BUILD_REVISION: ${{ inputs.build_revision }}
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_SOURCE_URL: ${{ vars.EXPO_PUBLIC_SOURCE_URL }}
  EXPO_PUBLIC_FACEBOOK_APP_ID: ${{ vars.EXPO_PUBLIC_FACEBOOK_APP_ID }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

jobs:
  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    name: ios
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    env:
      EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.3"

      - name: Install tools
        run: |
          pnpm install --frozen-lockfile
          gem install fastlane cocoapods --no-document

      - name: Check configuration
        env:
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::repository variable EXPO_PUBLIC_API_URL is not set"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::repository variable APPLE_TEAM_ID is not set"; exit 1; }
          test -n "$PLIST" || { echo "::error::secret IOS_GOOGLE_SERVICE_INFO_PLIST is not set"; exit 1; }
          printf '%s' "$PLIST" | base64 --decode > GoogleService-Info.plist
          node -e 'const c=require("./app.config.js")(); console.log(`Building ${c.version} (${c.ios.buildNumber}) against ${process.env.EXPO_PUBLIC_API_URL}`)'

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Choose signing
        id: signing
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IOS_DIST_CERT_P12 is not set: archiving unsigned, nothing will be uploaded"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write signing material
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ASC_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          d="$RUNNER_TEMP/ios-signing"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "$CERT" | base64 --decode > "$d/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$d/appstore.mobileprovision"
          {
            echo "IOS_DIST_CERT_PATH=$d/dist.p12"
            echo "IOS_PROFILE_PATH=$d/appstore.mobileprovision"
          } >> "$GITHUB_ENV"
          if [ -n "$ASC_P8" ]; then
            printf '%s' "$ASC_P8" | base64 --decode > "$d/asc.p8"
            echo "ASC_KEY_PATH=$d/asc.p8" >> "$GITHUB_ENV"
          fi

      - name: Build, sign and upload to TestFlight
        if: steps.signing.outputs.signed == 'true'
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "$UPLOAD" = "true" ]; then fastlane ios release; else fastlane ios release skip_upload:true; fi

      - name: Build (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: fastlane ios build_unsigned

      - name: Keep the IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa-${{ inputs.tag }}
          path: apps/mobile/build/RFSPager.ipa
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/ios-signing"

  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # The hosted runner has ~14 GB free; three ABIs of native output plus the
      # NDKs and caches filled it ("No space left on device") and killed the
      # runner mid-build. Drop large preinstalled toolchains this job never uses.
      - name: Free disk space
        working-directory: /
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /opt/az
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""

      # Caches Gradle's dependency and wrapper downloads between runs.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.3"

      - name: Install tools
        run: |
          pnpm install --frozen-lockfile
          gem install fastlane --no-document

      - name: Check configuration
        env:
          SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::repository variable EXPO_PUBLIC_API_URL is not set"; exit 1; }
          test -n "$SERVICES_JSON" || { echo "::error::secret ANDROID_GOOGLE_SERVICES_JSON is not set"; exit 1; }
          printf '%s' "$SERVICES_JSON" | base64 --decode > google-services.json
          node -e 'const c=require("./app.config.js")(); console.log(`Building ${c.version} (${c.android.versionCode}) against ${process.env.EXPO_PUBLIC_API_URL}`)'

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean

      # React Native pins one NDK; native library modules that pin none fall
      # back to the Android Gradle Plugin's default. Google's SDK downloads
      # intermittently arrive truncated ("Error on ZipFile unknown archive"),
      # so the NDKs are cached between runs and installs are retried.
      - name: Resolve NDK versions
        id: ndk
        run: |
          rn_ndk="$(sed -nE 's/^ndkVersion = "([^"]+)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          test -n "$rn_ndk" || { echo "::error::could not read React Native's ndkVersion"; exit 1; }
          echo "rn=$rn_ndk" >> "$GITHUB_OUTPUT"
          echo "versions=$rn_ndk 27.0.12077973" >> "$GITHUB_OUTPUT"
          # Remove the runner's other preinstalled NDKs; only these two are used.
          for d in "$ANDROID_SDK_ROOT"/ndk/*; do
            case "$(basename "$d")" in "$rn_ndk"|27.0.12077973) ;; *) sudo rm -rf "$d" ;; esac
          done
          echo "key=ndk-${{ runner.os }}-$rn_ndk-27.0.12077973" >> "$GITHUB_OUTPUT"

      # Only the two pinned NDKs: caching the whole ndk folder dragged several
      # preinstalled versions (gigabytes each) along with it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.rn }}
            ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          key: ${{ steps.ndk.outputs.key }}-only

      - name: Install the NDKs the build needs
        env:
          VERSIONS: ${{ steps.ndk.outputs.versions }}
        run: |
          for v in $VERSIONS; do
            if [ -f "$ANDROID_SDK_ROOT/ndk/$v/source.properties" ]; then echo "NDK $v present"; continue; fi
            for attempt in 1 2 3; do
              echo "installing NDK $v (attempt $attempt)"
              if yes | sdkmanager --install "ndk;$v" > /dev/null; then break; fi
              rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.downloadIntermediates" "$ANDROID_SDK_ROOT/ndk/$v"
              [ "$attempt" = 3 ] && { echo "::error::NDK $v failed to install after 3 attempts"; exit 1; }
              sleep 15
            done
          done

      # The generated defaults (2 GB heap, 512 MB Metaspace, serial, no build
      # cache) starve the build: the Gradle and Kotlin daemons looped on
      # OutOfMemoryError: Metaspace until the job timed out. The Kotlin daemon
      # gets its own limits rather than inheriting Gradle's. ~10.5 GB in total
      # leaves the 16 GB runner room for the parallel native compiles.
      - name: Tune Gradle for the runner
        run: |
          # The generated file has no trailing newline; without this the first
          # line below would be glued onto expo.inlineModules.watchedDirectories.
          {
            echo
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> android/gradle.properties
          tail -n 8 android/gradle.properties

      - name: Write signing material
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          d="$RUNNER_TEMP/android-signing"; mkdir -p "$d"; chmod 700 "$d"
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$d/upload.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$d/upload.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is not set: signing with a throwaway key, nothing will be uploaded"
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$d/throwaway.keystore" -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 1 -storepass "$pass" -keypass "$pass" -dname "CN=CI throwaway" >/dev/null 2>&1
            echo "::add-mask::$pass"
            {
              echo "ANDROID_KEYSTORE_PATH=$d/throwaway.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$pass"
              echo "ANDROID_KEY_ALIAS=throwaway"
              echo "ANDROID_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY_JSON" ]; then
            printf '%s' "$PLAY_JSON" | base64 --decode > "$d/play.json"
            echo "PLAY_JSON_KEY_PATH=$d/play.json" >> "$GITHUB_ENV"
          fi

      - name: Build, sign and upload to Play
        env:
          PLAY_TRACK: ${{ inputs.play_track }}
          UPLOAD: ${{ inputs.upload }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$UPLOAD" = "true" ] && [ "$SIGNED" = "true" ]; then
            fastlane android release
          else
            fastlane android release skip_upload:true
          fi

      # Play accepts a misaligned bundle on testing tracks but refuses to
      # release it to production; catch it here instead.
      - name: Check 16 KB page alignment
        run: python3 scripts/check-16kb-alignment.py android/app/build/outputs/bundle/release/app-release.aab

      - name: Keep the AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab-${{ inputs.tag }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
