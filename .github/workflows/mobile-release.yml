name: mobile-release

# Trigger: tags shaped like `mobile-v1.2.3`.
# Runs LOCAL EAS builds (no EAS cloud queue) on a macOS runner, then submits
# to the App Store + Play Store using `eas submit`.
#
# See docs/ci-secrets.md for the full inventory of required secrets.
on:
  push:
    tags:
      - "mobile-v*"

  # Allow manual runs for testing the pipeline without cutting a tag.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options: [all, ios, android]
      submit:
        description: "Submit to stores after build"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # iOS — runs on macOS so Xcode is available for the local build.
  # ---------------------------------------------------------------------------
  ios:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    name: ios (eas build --local)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SOURCE_URL: ${{ vars.EXPO_PUBLIC_SOURCE_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_FACEBOOK_APP_ID: ${{ vars.EXPO_PUBLIC_FACEBOOK_APP_ID }}
      EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Install eas-cli
        run: npm install -g eas-cli

      # Materialise platform-secret files from GH secrets. These are
      # base64-encoded in the secret store to survive the binary boundary.
      - name: Write GoogleService-Info.plist
        run: |
          echo "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > GoogleService-Info.plist

      - name: Check deployment configuration
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "EXPO_PUBLIC_API_URL repository variable is required"; exit 1; }
          test -n "$EXPO_PUBLIC_EAS_PROJECT_ID" || { echo "EXPO_PUBLIC_EAS_PROJECT_ID repository variable is required"; exit 1; }

      - name: Build (local)
        run: |
          eas build \
            --platform ios \
            --profile release \
            --local \
            --non-interactive \
            --output build.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: apps/mobile/build.ipa
          retention-days: 14

      - name: Write App Store Connect API key
        if: github.event_name == 'push' || inputs.submit == 'true'
        run: |
          mkdir -p .secrets
          echo "${{ secrets.APPLE_ASC_KEY_P8 }}" | base64 -d > .secrets/asc.p8
          # eas submit reads ASC_KEY_PATH / ASC_KEY_ID / ASC_ISSUER_ID
          echo "ASC_KEY_PATH=$PWD/.secrets/asc.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=${{ secrets.APPLE_ASC_KEY_ID }}"     >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.APPLE_ASC_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Submit to App Store Connect
        if: github.event_name == 'push' || inputs.submit == 'true'
        run: |
          eas submit \
            --platform ios \
            --profile release \
            --path build.ipa \
            --non-interactive

  # ---------------------------------------------------------------------------
  # Android — can run on Linux; local EAS build needs Java + Android SDK.
  # ---------------------------------------------------------------------------
  android:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    name: android (eas build --local)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SOURCE_URL: ${{ vars.EXPO_PUBLIC_SOURCE_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_FACEBOOK_APP_ID: ${{ vars.EXPO_PUBLIC_FACEBOOK_APP_ID }}
      EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Write google-services.json
        run: echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json

      - name: Write upload keystore
        run: |
          mkdir -p .secrets
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 -d > .secrets/upload.keystore

      - name: Check deployment configuration
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "EXPO_PUBLIC_API_URL repository variable is required"; exit 1; }
          test -n "$EXPO_PUBLIC_EAS_PROJECT_ID" || { echo "EXPO_PUBLIC_EAS_PROJECT_ID repository variable is required"; exit 1; }

      - name: Build (local)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/.secrets/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          eas build \
            --platform android \
            --profile release \
            --local \
            --non-interactive \
            --output build.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: apps/mobile/build.aab
          retention-days: 14

      - name: Write Play service-account key
        if: github.event_name == 'push' || inputs.submit == 'true'
        run: |
          echo "${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > .secrets/play.json

      - name: Submit to Play Store
        if: github.event_name == 'push' || inputs.submit == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ${{ github.workspace }}/apps/mobile/.secrets/play.json
        run: |
          eas submit \
            --platform android \
            --profile release \
            --path build.aab \
            --non-interactive
