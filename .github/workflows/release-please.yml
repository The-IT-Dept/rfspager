name: release-please

# Opens / updates "Release: X" PRs for each component. Merging one of those
# PRs creates a tag, which is what the per-component release workflows
# (server-release / web-release / mobile-release) listen for.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
