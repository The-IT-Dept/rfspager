name: release-please

# Opens / updates the release PR. Merging it creates the vX.Y.Z tag and GitHub
# release.
#
# release-please runs as the org's GitHub App (BOT_APP_ID / BOT_APP_PRIVATE_KEY)
# rather than GITHUB_TOKEN: GitHub starts no workflows from events raised by
# GITHUB_TOKEN, so with it the release PR's CI waited for manual approval and
# the tag never started the server, web and receiver release workflows. With
# the App token both happen on their own.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # The org app can administer every repository; this token gets only
          # what release-please needs, on this repository only.
          repositories: rfspager
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # server-release, web-release and receiver-release start from the tag push.
  # The app build has no tag trigger: store uploads are slow and each one lands
  # in TestFlight / Play, so it only runs when apps/mobile changed.
  mobile-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Start the mobile build if the app changed
        run: |
          git fetch --tags --force
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ] && git diff --quiet "$prev" "$TAG" -- apps/mobile ':!apps/mobile/package.json' ':!apps/mobile/CHANGELOG.md'; then
            echo "apps/mobile unchanged since $prev; skipping the mobile build"
          else
            gh workflow run mobile-release.yml --ref main -f tag="$TAG"
            echo "started mobile-release.yml for $TAG (previous release: ${prev:-none})"
          fi
