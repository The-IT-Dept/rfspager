name: receiver-release

# Trigger: tags shaped like `v1.2.3`.
# Builds and pushes a multi-arch Docker image to GHCR, and publishes the bare
# binaries as release assets — those are what /api/binaries/receiver serves to
# Pis running the systemd installer.
on:
  push:
    tags:
      - "v*"
  # Tags pushed by release-please carry GITHUB_TOKEN, and GitHub will not
  # start a workflow from an event raised by that token. Until a PAT is
  # wired into release-please, this is how a release is shipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v5.1.0)"
        required: true

jobs:
  docker:
    name: build & push (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: meta
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $REF"; exit 1 ;;
          esac
          case "$REF" in *[!0-9A-Za-z.+-]*) echo "::error::unexpected characters in tag: $REF"; exit 1 ;; esac
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rfspager-receiver
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.receiver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=receiver
          cache-to: type=gha,scope=receiver,mode=max

  binaries:
    name: publish binaries
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            asset: rfspager-receiver-linux-arm64
          - platform: linux/amd64
            asset: rfspager-receiver-linux-amd64
          # Pi 2 (and 32-bit Raspberry Pi OS on later boards). The installer and
          # self-update already ask for linux-armv7 on armv7l hosts.
          - platform: linux/arm/v7
            asset: rfspager-receiver-linux-armv7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: meta
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $REF"; exit 1 ;;
          esac
          case "$REF" in *[!0-9A-Za-z.+-]*) echo "::error::unexpected characters in tag: $REF"; exit 1 ;; esac
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The receiver needs cgo against librtlsdr, so it cannot be cross-compiled
      # with GOARCH alone. Building through the same Dockerfile keeps the glibc
      # and librtlsdr ABI identical to the published image.
      - name: Build binary
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          docker buildx build \
            --platform "$PLATFORM" \
            --target binary \
            --output type=local,dest=./dist \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT" \
            --cache-from type=gha,scope=receiver \
            -f ./Dockerfile.receiver .

      - name: Stage asset + checksum
        run: |
          mkdir -p out
          cp ./dist/receiver "out/${{ matrix.asset }}"
          chmod 755 "out/${{ matrix.asset }}"
          cd out
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls -l

      # gh rather than an action: softprops/action-gh-release locates the release
      # a second way off GITHUB_REF, so on a workflow_dispatch from main it found
      # v5.1.0 and then failed trying to resolve refs/heads/main. `gh` takes the
      # tag it is given and nothing else. --clobber keeps re-runs idempotent.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "out/${{ matrix.asset }}" \
            "out/${{ matrix.asset }}.sha256" \
            --clobber --repo "${{ github.repository }}"
